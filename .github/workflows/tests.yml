name: Run general tests

on:
  push:
    branches-ignore:
      - main # Main has it's own workflow
    paths:
      - '*/**' # Ignore all root files...
      - 'pyproject.toml' # ...except the ones that change the test environment
      - 'uv.lock'
      - '.python-version'

  pull_request:
    paths: # Still run when PR to main
      - '*/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'

  workflow_dispatch: # Allow a manual run from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv pytest

      - name: Sync dependencies
        run: |
          uv venv
          uv sync --locked

      - name: Run tests
        run: .venv/bin/python -m pytest tests
